name: test

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc gcovr

      - name: Build and smoke test
        run: |
          chmod 755 * .* -R
          ./scripts/test.sh

      - name: Coverage build and report
        env:
          CC: gcc
        run: COVERAGE=1 ./scripts/test.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build_test/coverage*.html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: build_test/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-on-alpine-3_24_3:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.24.3
    steps:
      - name: Install dependencies
        run: |
          echo "http://dl-cdn.alpinelinux.org/alpine/v3.24/main" > /etc/apk/repositories
          echo "http://dl-cdn.alpinelinux.org/alpine/v3.24/community" >> /etc/apk/repositories
          apk update --no-cache
          apk upgrade --no-cache
          apk add --no-cache \
          sudo bash zsh build-base gcc make pkgconf fontconfig fontconfig-dev \
          git git-lfs nodejs npm lcov gzip libpng-dev curl
      - uses: actions/checkout@v4
      - name: Build and smoke test
        run: |
          chmod 755 * .* -R
          ./scripts/test.sh

  test-on-ubuntu-22_04-arm:
    runs-on: ubuntu-22.04-arm
    defaults:
      run:
        shell: bash
    steps:
